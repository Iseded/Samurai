<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Толстый самурай 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Rubik:wght@500;700&display=swap">
<style>
/* Layout: one full-screen stage. Round arena on a canvas, HUD pinned to the top, thumb controls at the bottom, menu and result cards as overlays. Pastel single look by choice. */
:root {
  --sky: #CFE8F3;
  --pink: #F7CBD6;
  --mint: #CBEBD9;
  --lav: #DCD3F2;
  --butter: #F9E8B2;
  --peach: #FAD6C2;
  --pink-d: #E98AA5;
  --mint-d: #7FC8A2;
  --ink: #5A4A68;
  --ink-soft: #8C7C9A;
  --card: #FFF8FB;
  --font-display: 'Rubik', 'Nunito', system-ui, sans-serif;
  --font-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(180deg, #E4F0FA 0%, #F6E4EE 58%, #FCEBDF 100%);
  color: var(--ink);
  font: 600 15px/1.35 var(--font-body);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid #8E7CC3; outline-offset: 2px; }

#app { position: relative; height: 100%; }
#cv, #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* HUD */
.top { position: absolute; left: 0; right: 0; top: 12px; display: flex; gap: 10px; align-items: center; pointer-events: none; z-index: 5; }
.top > * { pointer-events: auto; }
.hud { display: none; flex: 1; min-width: 0; gap: 10px; align-items: center; }
body[data-mode="fight"] #hudFight, body[data-mode="train"] #hudTrain, body[data-mode="archer"] #hudTrain { display: flex; }
.bar { flex: 1; min-width: 0; }
.nm { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 700 11px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 4px 4px; }
.track { height: 14px; border-radius: 9px; background: rgba(255,255,255,.8); border: 2px solid #fff; box-shadow: inset 0 0 0 1.5px rgba(122,106,140,.3); overflow: hidden; }
.track i { display: block; height: 100%; width: 100%; background: var(--mint-d); border-radius: 9px; transition: width .15s; }
.foe .track i { background: var(--pink-d); }
.foe .nm { text-align: right; margin: 0 4px 4px 0; }
.bar .track.stam { height: 7px; margin-top: 4px; border-width: 1.5px; }
.bar .track.stam i { background: #F2C96B; }
.stat { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; background: rgba(255,255,255,.7); border-radius: 14px; padding: 6px 12px; min-width: 64px; }
.stat span { font: 700 10px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.stat b { font: 700 20px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.lives { flex-direction: row; align-items: center; gap: 4px; margin-left: auto; padding: 8px 12px; }
.lives i { font-style: normal; font-size: 20px; line-height: 1; color: var(--pink-d); transition: opacity .2s, transform .2s; }
.lives i.lost { opacity: .25; transform: scale(.8); }
#btnQuit { display: none; flex: none; height: 40px; padding: 0 16px; border-radius: 20px; background: rgba(255,255,255,.8); font: 700 13px/1 var(--font-display); letter-spacing: .04em; color: var(--ink); box-shadow: 0 3px 0 rgba(150,120,170,.25); }
body[data-mode="fight"] #btnQuit, body[data-mode="train"] #btnQuit, body[data-mode="archer"] #btnQuit { display: block; }

#toast { position: absolute; left: 50%; top: 66px; transform: translate(-50%, -6px); max-width: 100%; padding: 8px 16px; border-radius: 18px; background: rgba(255,255,255,.9); color: var(--ink); font-weight: 800; font-size: 13px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 6; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Fight controls */
#joy, #btnAtk, #btnDash { display: none; position: absolute; z-index: 4; }
body[data-mode="fight"] #joy, body[data-mode="fight"] #btnAtk, body[data-mode="fight"] #btnDash { display: block; }
#joy { left: 0; bottom: 0; width: 48%; height: 220px; }
.act { border-radius: 50%; border: 3px solid #fff; font: 700 15px/1 var(--font-display); letter-spacing: .03em; color: var(--ink); box-shadow: 0 6px 0 rgba(160,110,150,.3); transition: transform .06s, box-shadow .06s; }
.act:active, .act.on { transform: translateY(4px); box-shadow: 0 2px 0 rgba(160,110,150,.3); }
#btnAtk { right: 0; bottom: 38px; width: 100px; height: 100px; background: radial-gradient(circle at 35% 30%, #FFE3EA, var(--pink)); font-size: 19px; }
#btnDash { right: 116px; bottom: 22px; width: 68px; height: 68px; background: radial-gradient(circle at 35% 30%, #F0EAFF, var(--lav)); }

/* Menu */
#menu { display: none; position: absolute; inset: 0; flex-direction: column; justify-content: space-between; padding-block: 18px 14px; pointer-events: none; z-index: 8; }
#menu > * { pointer-events: auto; }
body[data-mode="menu"] #menu { display: flex; }
.kicker { margin: 0 0 6px; font: 700 12px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
h1 { margin: 0; font: 700 clamp(36px, 11vw, 56px)/1 var(--font-display); letter-spacing: -.01em; color: var(--ink); text-shadow: 3px 3px 0 var(--pink); text-wrap: balance; }
.actions { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 28px; background: rgba(255,248,251,.84); border: 3px solid #fff; }
.big { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; width: 100%; min-width: 0; padding: 12px 14px; border-radius: 22px; text-align: left; border: 3px solid #fff; box-shadow: 0 6px 0 rgba(150,120,170,.28); transition: transform .06s, box-shadow .06s; }
.big:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(150,120,170,.28); }
.big b { font: 700 19px/1.1 var(--font-display); }
.big span { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
.big.train { background: var(--mint); }
.big.fight { background: var(--pink); }
.big.train2 { background: var(--butter); }
.big.tower { background: var(--lav); }
.big.archer { background: var(--peach); }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.three .big { padding: 10px 10px; }
.three .big b { font-size: 16px; }
.three .big span { font-size: 11px; }
.picks { display: flex; flex-direction: column; gap: 8px; margin: 0 0 14px; }
.pick { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; text-align: left; padding: 10px 14px; border-radius: 18px; background: var(--butter); border: 3px solid #fff; box-shadow: 0 4px 0 rgba(150,120,170,.28); }
.pick b { font: 700 16px/1.1 var(--font-display); }
.pick span { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
.btn:disabled, .chip:disabled { opacity: .45; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grp { margin: 0; font: 700 11px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
#pad { display: none; position: absolute; left: 0; right: 0; bottom: 14px; z-index: 4; grid-template-columns: repeat(4, 1fr); gap: 10px; }
body[data-mode="train"][data-kind="arrows"] #pad { display: grid; }
.dir { height: 76px; border-radius: 24px; border: 3px solid #fff; background: radial-gradient(circle at 35% 30%, #F0EAFF, var(--lav)); font: 700 34px/1 var(--font-display); box-shadow: 0 6px 0 rgba(160,110,150,.3); transition: transform .06s, box-shadow .06s; }
.dir:active, .dir.on { transform: translateY(4px); box-shadow: 0 2px 0 rgba(160,110,150,.3); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row .lbl { font: 700 12px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin-right: 2px; }
.chip { padding: 7px 11px; border-radius: 14px; background: rgba(255,255,255,.7); border: 2px solid transparent; font-weight: 800; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--lav); border-color: #fff; box-shadow: 0 2px 0 rgba(150,120,170,.28); }
.rec { margin: 0; font-size: 12px; color: var(--ink-soft); }

/* Result */
#result { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(250,232,240,.6); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); z-index: 20; }
.card { width: min(100%, 340px); padding: 26px 22px 22px; border-radius: 30px; background: var(--card); border: 4px solid #fff; box-shadow: 0 10px 0 rgba(150,120,170,.25), 0 24px 40px rgba(150,120,170,.18); text-align: center; }
.card h2 { margin: 0 0 6px; font: 700 28px/1.1 var(--font-display); text-wrap: balance; }
.card .big-n { margin: 4px 0; font: 700 56px/1 var(--font-display); color: var(--pink-d); font-variant-numeric: tabular-nums; }
.card p { margin: 0 0 18px; color: var(--ink-soft); font-size: 14px; }
.card .btns { display: flex; flex-direction: column; gap: 10px; }
.btn { padding: 13px 18px; border-radius: 20px; font: 700 17px/1 var(--font-display); border: 3px solid #fff; box-shadow: 0 5px 0 rgba(150,120,170,.28); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(150,120,170,.28); }
.btn.a { background: var(--mint); }
.btn.b { background: var(--lav); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>

<main id="app">
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="cv" aria-label="Игровое поле"></canvas>

  <div class="top">
    <div id="hudFight" class="hud">
      <div class="bar"><span class="nm">Ты</span><div class="track"><i id="hpMe"></i></div><div class="track stam"><i id="stMe"></i></div></div>
      <div class="bar foe"><span class="nm" id="nmFoe">Бот</span><div class="track"><i id="hpFoe"></i></div><div class="track stam"><i id="stFoe"></i></div></div>
    </div>
    <div id="hudTrain" class="hud">
      <div class="stat"><span>Счёт</span><b id="stScore">0</b></div>
      <div class="stat"><span id="lbCombo">Серия</span><b id="stCombo">0</b></div>
      <div class="stat lives" id="stLives" aria-label="Жизни"></div>
    </div>
    <button id="btnQuit" type="button">Меню</button>
  </div>

  <div id="toast" role="status"></div>

  <div id="joy"></div>
  <button id="btnDash" class="act" type="button">Рывок</button>
  <button id="btnAtk" class="act" type="button">Удар</button>

  <div id="pad" role="group" aria-label="Стрелки">
    <button class="dir" type="button" data-dir="0" aria-label="Влево">&larr;</button>
    <button class="dir" type="button" data-dir="1" aria-label="Вверх">&uarr;</button>
    <button class="dir" type="button" data-dir="2" aria-label="Вниз">&darr;</button>
    <button class="dir" type="button" data-dir="3" aria-label="Вправо">&rarr;</button>
  </div>

  <section id="menu">
    <header>
      <p class="kicker">Игра для телефона · 3D</p>
      <h1>Толстый самурай</h1>
    </header>
    <div class="actions">
      <p class="grp">Тренировка</p>
      <div class="two">
        <button class="big train" type="button" data-start="chop"><b>Бамбук</b><span>Руби, промах стоит жизни</span></button>
        <button class="big train2" type="button" data-start="arrows"><b>Стрелки</b><span>Запомни пять и повтори</span></button>
      </div>
      <p class="grp">Арена</p>
      <div class="three">
        <button class="big fight" type="button" data-start="duel"><b>Дуэль</b><span>Новый соперник</span></button>
        <button class="big tower" type="button" data-start="tower"><b>Башня</b><span>Пять боёв</span></button>
        <button class="big archer" type="button" data-start="archer"><b>Лучник</b><span>Рикошеты</span></button>
      </div>
      <div class="row" role="group" aria-label="Сложность бота">
        <span class="lbl">Бот</span>
        <button class="chip" type="button" data-diff="easy" aria-pressed="false">Легко</button>
        <button class="chip" type="button" data-diff="normal" aria-pressed="true">Нормально</button>
        <button class="chip" type="button" data-diff="hard" aria-pressed="false">Сложно</button>
        <button class="chip" type="button" data-diff="master" aria-pressed="false">Мастер</button>
        <button class="chip" type="button" id="btnSound" aria-pressed="true">Звук: вкл</button>
        <button class="chip" type="button" id="btnWeapon">Оружие: Катана</button>
      </div>
      <p class="rec" id="rec"></p>
    </div>
  </section>

  <section id="result" hidden>
    <div class="card">
      <h2 id="resTitle"></h2>
      <div class="big-n" id="resBig"></div>
      <p id="resLine"></p>
      <div class="picks" id="picks" hidden></div>
      <div class="btns">
        <button class="btn a" type="button" id="btnAgain">Ещё раз</button>
        <button class="btn b" type="button" id="btnMenu">В меню</button>
      </div>
    </div>
  </section>
</main>

function rangedLogic(b, p, dt, d, o) {
  if (b.thrW > 0) {
    b.thrW -= dt; b.vx = b.vy = 0;
    if (b.thrW > .12) b.thrA = aimAt(b, p, b.cfg.pred);
    if (b.thrW <= 0) o.fire(b);
    return true;
  }
  b.thr -= dt;
  if (b.thr <= 0 && d > o.minD && b.st >= 14) { spend(b, 14); b.thrW = o.wind; b.thrA = aimAt(b, p, b.cfg.pred); beep(260, .1, 'sine', .03); }
  return false;
}
// A dash that ends in a forced quick attack.
function gapClose(b, dt, d, ang, minD, lo, hi) {
  b.gapT = (b.gapT == null ? 2.5 : b.gapT) - dt;
  if (b.gapT > 0 || d < minD || b.dashCd > 0 || b.st < b.dashCost + b.atkCost) return false;
  b.gapT = rnd(lo, hi) * (b.rage ? .7 : 1);
  spend(b, b.dashCost); beginDash(b, ang); b.afterDash = true; b.punishForce = true; return true;
}
var RG_STAR = { minD: 100, wind: .34, fire: function (b) {
  var n = b.hp < b.maxHp * .5 ? 3 : 1;
  for (var i = 0; i < n; i++) fireStar(b, b.thrA + (i - (n - 1) / 2) * .26, { speed: 250 });
  b.thr = rnd(.9, 1.4);
} };
var RG_KUNAI = { minD: 120, wind: .3, fire: function (b) {
  var n = b.rage ? 3 : 1;
  for (var i = 0; i < n; i++) fireStar(b, b.thrA + (i - (n - 1) / 2) * .24, { speed: 270 });
  b.thr = rnd(2, 3);
} };
var RG_SHOGUN = { minD: 90, wind: .45, fire: function (b) {
  var i;
  if (Math.random() < .5) { for (i = 0; i < 5; i++) fireStar(b, b.thrA + (i - 2) * .2, { kind: 'blade', speed: 270, r: 11, dmg: 11, deflect: false }); }
  else { for (i = -1; i <= 1; i += 2) fireStar(b, b.thrA + i * .17, { kind: 'wave', speed: 250, r: 24, dmg: 16, deflect: false }); }
  b.thr = rnd(1.3, 2.1);
} };
function shogunPhase2(b) {
  b.rage = true; b.armor = true; b.pose = 1.1; b.inv = 1.1; b.windup = -1; b.swing = -1; b.comboLeft = 0;
  b.cfg.speed *= 1.15; b.cfg.wind *= .8; b.cfg.cd *= .7; b.comboFix = 3; b.stReg *= 1.3; b.st = b.stMax; b.thr = 1;
  toast('Вторая стадия! Сёгун мечет клинки.'); shake = 12; poof(b.x, b.y); poof(b.x, b.y);
  addP({ k: 'ring', x: b.x, y: b.y + 20, vx: 0, vy: 0, g: 0, life: 0, max: .8, size: 30, grow: 220, col: '#F2A0B8' });
  beep(110, .7, 'sawtooth', .06, -40);
}
var SPECIAL = {
  // Monk: hops back when you get close, then pokes from range
  kite: function (b, p, dt, d, ang) {
    if (b.dashCd <= 0 && d < 68 && b.st >= b.dashCost) {
      spend(b, b.dashCost); beginDash(b, ang + Math.PI + rnd(-.5, .5)); b.cd = Math.min(b.cd, .2); return true;
    }
    return false;
  },
  // Shinobi: throws shuriken from range (three at once when hurt)
  throw: function (b, p, dt, d) { return rangedLogic(b, p, dt, d, RG_STAR); },
  // Brute: armoured hammer, shockwave on the ground, leaps at you, double waves when enraged
  slam: function (b, p, dt, d, ang) {
    if (!b.rage && b.hp < b.maxHp * .4) {
      b.rage = true; b.cfg.speed *= 1.15; b.cfg.wind *= .85;
      toast('Громила в ярости: волны идут двойные!'); shake = 8; poof(b.x, b.y); beep(120, .4, 'sawtooth', .05, -50);
    }
    return gapClose(b, dt, d, ang, 140, 3, 4.5);
  },
  // Dancer: throws kunai, vanishes and reappears behind you with a combo
  blink: function (b, p, dt, d, ang) {
    if (!b.rage && b.hp < b.maxHp * .5) { b.rage = true; b.cfg.speed *= 1.1; toast('Танцор ускоряется!'); poof(b.x, b.y); }
    if (rangedLogic(b, p, dt, d, RG_KUNAI)) return true;
    b.blinkT = (b.blinkT == null ? 1.8 : b.blinkT) - dt;
    if (b.blinkT > 0 || b.st < 24) return false;
    spend(b, 24); b.blinkT = rnd(2, 3.2) * (b.rage ? .65 : 1);
    poof(b.x, b.y);
    var nx = p.x - p.face * 58, ny = p.y + rnd(-22, 22), l = Math.hypot(nx, ny);
    if (l > RR) { nx *= RR / l; ny *= RR / l; }
    b.x = nx; b.y = ny; b.kx = b.ky = 0; b.vx = b.vy = 0;
    poof(b.x, b.y);
    b.face = p.face; b.comboLeft = b.rage ? 3 : 2; b.windup = 0; b.windDur = .28; b.aim = Math.atan2(p.y - b.y, p.x - b.x);

    return true;

  // Shogun: dash-ins and triple slashes; second stage throws blades and crescent waves
  shogun: function (b, p, dt, d, ang) {
    if (!b.rage && b.hp < b.maxHp * .5) { shogunPhase2(b); return true; }
    if (b.pose > 0) { b.pose -= dt; b.vx = b.vy = 0; return true; }
    if (b.rage && rangedLogic(b, p, dt, d, RG_SHOGUN)) return true;
    return gapClose(b, dt, d, ang, 150, 2.4, 3.6);
  }
};

}

/* --- arrow memory drill --- */

/* --- shared --- */
function updateTrain(dt) {
  var s = T.sam;
  s.t += dt; if (s.hurt > 0) s.hurt = Math.max(0, s.hurt - dt);
  if (s.squash > 0) s.squash = Math.max(0, s.squash - dt * .5);
  if (s.swing >= 0) { s.swing += dt; if (s.swing >= s.swingDur) s.swing = -1; }
  if (over) return;
  T.time += dt;
  if (trainKind === 'arrows') { updateArrows(dt); return; }
  T.spawn -= dt;
  if (T.spawn <= 0) {
    var side = Math.random() < .5 ? -1 : 1;
    spawnStalk(side);
    if (T.score >= 18 && Math.random() < .22) spawnStalk(-side);
    T.spawn = clamp(1.15 - T.score * .012, .5, 1.15) * rnd(.85, 1.2);
  }
  var sp = Math.min(78 + T.score * 2.2, 185);
  for (var i = T.stalks.length - 1; i >= 0; i--) {
    var st = T.stalks[i];
    st.d -= sp * dt;
    if (st.d <= 44) {
      T.stalks.splice(i, 1);
      spark(st.side * 40, 0, 12, ['#FFFFFF', '#F7CBD6']); bits(st.side * 40, 0, 6, -st.side);
      loseLife(0, 'Ай!');

    }
  }

/* ---------- archer ---------- */
var FOE = {

var FOE_PAL = { blob: PALS[1], runner: PALS[0], bomb: PALS[2], shield: PALS[4], boss: PALS[3] };

function nextWave() {
  var w = ++Ar.wave, q = [], n = Math.min(4 + w * 2, 22), i, boss = w % 5 === 0;
  for (i = 0; i < n; i++) {
    var r = Math.random(), t = 'blob';

}

function killFoe(f, a) {

  if (f.bomb) addP({ k: 'ring', x: f.x, y: f.y, vx: 0, vy: 0, g: 0, life: 0, max: .4, size: 10, grow: 62, col: '#F2A0B8' });
  if (Ar.lives <= 0) { over = true; overT = 0; resultShown = false; Ar.aim = null; beep(220, .4, 'sawtooth', .04, -100); }

function updateArcher(dt) {

  if (h.squash > 0) h.squash = Math.max(0, h.squash - dt * .5);

  if (Ar.ammo < 3) { Ar.ammoT += sd; if (Ar.ammoT >= 1) { Ar.ammo++; Ar.ammoT = 0; } }

    Ar.qT -= sd;

/* --- aiming --- */
function traceAim(ang) {

}
function archerDown(e) {

app.addEventListener('pointerdown', archerDown);
addEventListener('pointermove', archerMove);
addEventListener('pointerup', archerUp);
addEventListener('pointercancel', archerUp);

/* --- drawing --- */
function drawArrowShot(a) {

  g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 7; g.beginPath(); g.moveTo(-38, 0); g.lineTo(0, 0); g.stroke();
  g.strokeStyle = '#B58A6A'; g.lineWidth = 3; g.beginPath(); g.moveTo(-24, 0); g.lineTo(0, 0); g.stroke();
  g.fillStyle = a.bn > 0 ? '#F2A0B8' : '#9EC6EA'; g.strokeStyle = OUT; g.lineWidth = 1.8;
  g.beginPath(); g.moveTo(10, 0); g.lineTo(-1, -5.5); g.lineTo(-1, 5.5); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = '#F7CBD6'; g.beginPath(); g.moveTo(-24, 0); g.lineTo(-31, -5); g.lineTo(-27, 0); g.lineTo(-31, 5); g.closePath(); g.fill();
  g.restore();
}
function drawArcher() {
  var h = Ar.hero, i, aiming = Ar.aim && Ar.aim.on && Math.hypot(Ar.aim.sx - Ar.aim.cx, Ar.aim.sy - Ar.aim.cy) > 18;
  if (aiming) {

    g.save(); g.setLineDash([7, 9]); g.lineWidth = 3; g.lineCap = 'round';
    for (i = 0; i < pts.length - 1; i++) {

      g.beginPath(); g.moveTo(pts[i][0], pts[i][1]); g.lineTo(pts[i + 1][0], pts[i + 1][1]); g.stroke();

      g.strokeStyle = '#F2C96B'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(f.x + 3, by - 7); g.lineTo(f.x + 8, by - 12); g.stroke();
      g.fillStyle = '#F7CBD6'; g.beginPath(); g.arc(f.x + 8, by - 13, 2.5 + Math.abs(Math.sin(Ar.t * 20)) * 1.5, 0, TAU); g.fill();
    }
    if (f.type === 'boss') {

      g.fillStyle = '#E98AA5'; rr(f.x - 28, f.y - 96, Math.max(6, 56 * f.hp / f.maxHp), 9, 4.5); g.fill();

  }
}
function drawArcherUI() {
  var a = Ar.aim;
  if (!a || !a.on) return;
  g.save();
  g.fillStyle = 'rgba(190,170,235,.16)'; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(122,106,140,.55)'; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(a.sx, a.sy); g.lineTo(a.cx, a.cy); g.stroke();
  g.beginPath(); g.arc(a.sx, a.sy, 16, 0, TAU); g.stroke();
  g.fillStyle = '#F2A0B8'; g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); g.arc(a.cx, a.cy, 11, 0, TAU); g.fill(); g.stroke();
  g.restore();
}

/* ---------- UI ---------- */
var toastTimer = 0;
function toast(msg) {

  clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3400);
}

  $('picks').hidden = true; $('btnAgain').disabled = $('btnMenu').disabled = false;

}

}
function updateRec() {
  $('rec').textContent = 'Рекорды: бамбук ' + bestTrain + ', стрелки ' + bestArrows + ', лучник ' + bestArcher + '  ·  Башня: ' + towerBest + '/5  ·  Побед в дуэли: ' + wins;
}
function showPicks(offers) {

  offers.forEach(function (k) {

}
function updateWeaponBtn() { var b = $('btnWeapon'); b.textContent = 'Оружие: ' + PW[weapon].name; b.disabled = owned.length < 2; }
function showEndCard() {

    showResult('Зал пал на волне ' + Ar.wave, String(Ar.score), (nb ? 'Новый рекорд! ' : 'Рекорд: ' + bestArcher + '. ') + 'Лучший выстрел: ' + Ar.bestCombo + ' в ряд.');
    return;
  }

      var s = Tw.stage, def = TOWER[s];

          var offers = PW_ORDER.filter(function (k) { return owned.indexOf(k) < 0; }).sort(function () { return Math.random() - .5; }).slice(0, 3);
          showResult('Башня покорена!', '', offers.length ? 'Сёгун повержен. Выбери новое оружие:' : 'Сёгун повержен. Ты прошёл все пять этапов.', 'Заново');

    showResult('Тренировка окончена', String(T.score),
      (T.newBest ? 'Новый рекорд! ' : 'Рекорд: ' + best + '. ') + (trainKind === 'arrows' ? 'Чисто срубленных: ' + A.rounds + '. ' : '') + 'Лучшая серия: ' + T.maxCombo + '.');
  }

function updateSoundBtn() { var b = $('btnSound'); b.textContent = 'Звук: ' + (soundOn ? 'вкл' : 'выкл'); b.setAttribute('aria-pressed', String(soundOn)); }
function updateDiffBtns() {
  document.querySelectorAll('[data-diff]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.diff === diff)); });
}
var hudCache = {};
function setText(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }

function setW(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).style.width = v + '%'; } }
function updateHud() {
  if (mode === 'fight' && F.p) {
    setW('hpMe', Math.round(F.p.hp / F.p.maxHp * 100)); setW('hpFoe', Math.round(F.b.hp / F.b.maxHp * 100));
    setW('stMe', Math.round(F.p.st / F.p.stMax * 100)); setW('stFoe', Math.round(F.b.st / F.b.stMax * 100));

/* ---------- main loop ---------- */
function update(dt) {
  tNow += dt;
  for (var i = 0; i < 2; i++) padFlash[i] = Math.max(0, padFlash[i] - dt * 5);
  shake = Math.max(0, shake - dt * 28);
  petals.forEach(function (p) {
    p.y += p.v * dt; p.x += Math.sin(tNow * .9 + p.ph) * p.sw * dt;
    if (p.y > H + 12) { p.y = -12; p.x = rnd(0, W); }
  });
  for (var a = parts.length - 1; a >= 0; a--) {
    var p = parts[a]; p.life += dt;
    if (p.life >= p.max) { parts.splice(a, 1); continue; }
    p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt;

}
function draw2D() {

  var sx = shake > 0 && !reduce ? rnd(-shake, shake) : 0, sy = shake > 0 && !reduce ? rnd(-shake, shake) : 0;

}

function draw() {
  if (!use3d) { draw2D(); return; }
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, W, H);
  render3D();
  g.setTransform(DPR, 0, 0, DPR, 0, 0);

/* ---------- input ---------- */
var joyEl = $('joy');
function joyMove(e) {
  var r = app.getBoundingClientRect();
  var dx = e.clientX - r.left - joy.ox, dy = e.clientY - r.top - joy.oy, d = Math.hypot(dx, dy), m = 48;

press($('btnDash'), function () { dashBuf = .18; });

app.addEventListener('pointerdown', function (e) {

addEventListener('keydown', function (e) {

  if (window.__TS_DEBUG) window.__TS_DEBUG = { setDiff: function (k) { diff = k; }, Ar: Ar, startArcher: startArcher, A: A, T: T, F: F, Tw: Tw, projs: projs, startFight: startFight, startTrain: startTrain };
  setMode('menu');
  requestAnimationFrame(frame);
})();
})();
